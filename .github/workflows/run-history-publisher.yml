name: Publish run history
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/publish_run_history.py"
      - "data/research/run-history.schema.json"
      - ".github/workflows/run-history-publisher.yml"
permissions:
  contents: write
concurrency:
  group: main-state-writers
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build normalized journal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_run_history.py
      - name: Publish if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/run-history
          if git diff --cached --quiet; then
            echo "RUN_HISTORY unchanged"
            exit 0
          fi
          git commit -m "Обновить журнал запусков"
          git push origin HEAD:main
