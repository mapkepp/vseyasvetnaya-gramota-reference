name: Status surface self-heal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research-status.html
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
concurrency:
  group: dev-state-writers
  cancel-in-progress: false
  queue: max
jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record dev integrity and system experience
        run: |
          set -euo pipefail
          git fetch origin dev
          git worktree add /tmp/dev-health origin/dev
          cd /tmp/dev-health
          python3 scripts/system_self_check.py
          python3 scripts/record_system_experience.py
          mkdir -p /tmp/health-snapshot
          cp data/research/system-health.json data/research/system-experience.json data/research/status-surface-registry.json /tmp/health-snapshot/
          for attempt in 1 2 3; do
            git fetch origin dev
            git reset --hard origin/dev
            cp /tmp/health-snapshot/system-health.json /tmp/health-snapshot/system-experience.json /tmp/health-snapshot/status-surface-registry.json data/research/
            git config user.name "toolbox-self-repair"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research/system-health.json data/research/system-experience.json data/research/status-surface-registry.json
            git diff --cached --quiet && exit 0
            git commit -m "automation: record system health and experience"
            if git push origin HEAD:dev; then
              echo "HEALTH_PUBLISH_OK"
              exit 0
            fi
          done
          echo "::error::Health publication could not safely advance dev after 3 attempts."
          exit 1

      - name: Validate status page
        id: validate
        shell: python
        run: |
          import re,subprocess,pathlib
          s=pathlib.Path("research-status.html").read_text(encoding="utf-8")
          m=re.search(r"<script>([\s\S]*?)</script>",s)
          pathlib.Path("/tmp/status.js").write_text(m.group(1),encoding="utf-8") if m else pathlib.Path("/tmp/status.js").write_text("",encoding="utf-8")
          ok=bool(m) and "staticFallback" in s and subprocess.run(["node","--check","/tmp/status.js"]).returncode==0
          pathlib.Path("/tmp/status.ok").write_text("1" if ok else "0")
          print("STATUS_OK="+str(ok))
      - name: Install minimal maintenance surface when broken
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          if [ "$(cat /tmp/status.ok)" = "0" ]; then
            cat > research-status.html <<'EOF'
          <!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статус автономной системы</title><style>body{font:16px system-ui;margin:40px;max-width:900px}article{padding:24px;border:1px solid #ccc;border-radius:12px}</style><article><h1>Статусная страница временно восстанавливается</h1><p>Тулбокс обнаружил неисправность интерфейса и автоматически выполняет восстановление.</p><p>Основная система исследований продолжает работать отдельно. Следующая автоматическая проверка выполняется не позднее чем через 10 минут.</p><p>Это временная заглушка; она заменяется основной статусной страницей после успешной проверки.</p></article></html>
          EOF
            git config user.name "toolbox-status-self-heal"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-status.html
            git commit -m "automation: install status maintenance fallback"
            git push origin HEAD:main
          fi
