name: Autonomous branch archive and cleanup
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */2 * * *"
permissions:
  contents: write
concurrency:
  group: dev-state-writers
  cancel-in-progress: false
jobs:
  archive-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Archive unique useful commits and clean safe historical branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/archive_and_cleanup_branches.py
      - name: Publish archive and cleanup ledger
        run: |
          git config user.name "branch-archive-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/branch-archive data/research/branch-cleanup.json
          git diff --cached --quiet || git commit -m "automation: archive and clean obsolete branches"
          git push origin HEAD:dev
