name: System integrity and self-repair
# runtime-validation-trigger: recheck health after branch-intake syntax repair
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: system-self-repair-writer
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Run integrity checks and bounded repairs
        run: |
          set -euo pipefail
          python3 scripts/system_self_check.py
          python3 scripts/process_system_data.py
          python3 scripts/self_improvement_cycle.py
          python3 scripts/self_improvement_apply.py
      - name: Publish repaired state
        run: |
          set -euo pipefail
          git config user.name "toolbox-self-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research
          git diff --cached --quiet || git commit -m "automation: record self-check repair and learning"
          for attempt in 1 2 3; do
            git fetch origin dev
            remote_sha="$(git rev-parse origin/dev)"
            local_sha="$(git rev-parse HEAD)"
            if git merge-base --is-ancestor "$remote_sha" "$local_sha"; then
              if git push origin HEAD:dev; then
                echo "SELF_REPAIR_PUBLISH_OK"
                exit 0
              fi
            else
              echo "SELF_REPAIR_REFRESH: dev advanced; regenerate derived state from current dev."
              git reset --hard origin/dev
              python3 scripts/system_self_check.py
              python3 scripts/process_system_data.py
              python3 scripts/self_improvement_cycle.py
              python3 scripts/self_improvement_apply.py
              git add data/research
              git diff --cached --quiet || git commit -m "automation: refresh self-repair state"
            fi
          done
          echo "::error::SELF_REPAIR_PUBLISH_FAILED"
          exit 1
      - name: Continue research only after successful repair
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          queue="$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/research/autonomous-queue.json?ref=dev" | jq -r '.content' | tr -d '\n' | base64 -d)"
          pending="$(echo "$queue" | jq '[.tasks[] | select(.status=="PENDING")] | length')"
          worker_active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/runs?branch=dev&per_page=10" --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' || echo 0)"
          if ! [[ "$pending" =~ ^[0-9]+$ ]] || ! [[ "$worker_active" =~ ^[0-9]+$ ]]; then
            echo "::error::SELF_REPAIR_HANDOFF_INVALID_STATE"
            exit 1
          fi
          if [ "$pending" -gt 0 ] && [ "$worker_active" -eq 0 ]; then
            echo "SELF_REPAIR_HANDOFF: repair succeeded; dispatching one worker for $pending pending tasks."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/dispatches" -f ref=dev >/dev/null
          else
            echo "SELF_REPAIR_HANDOFF: no worker dispatch needed (pending=$pending active=$worker_active)."
          fi
