name: System integrity and self-repair
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
concurrency:
  group: system-self-repair-writer
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Fetch main for status validation
        run: git fetch origin main:refs/remotes/origin/main
      - name: Run integrity checks and bounded repairs
        run: python3 scripts/system_self_check.py
      - name: Publish health and experience
        run: |
          git config user.name "toolbox-self-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/system-health.json data/research/system-experience.json data/research/status-surface-registry.json
          git diff --cached --quiet || git commit -m "automation: record system health and experience"
          for attempt in 1 2 3; do
            git fetch origin dev
            local_sha="$(git rev-parse HEAD)"
            remote_sha="$(git rev-parse origin/dev)"
            if ! git merge-base --is-ancestor "$local_sha" "$remote_sha"; then
              echo "SELF_REPAIR_REBASE_SAFE_RETRY: dev advanced; refreshing checkout and regenerating derived health state."
              git reset --hard origin/dev
              python3 scripts/system_self_check.py
              git add data/research/system-health.json data/research/system-experience.json data/research/status-surface-registry.json
              git diff --cached --quiet || git commit -m "automation: record self-check repair and experience"
              continue
            fi
            if git push origin HEAD:dev; then
              echo "SELF_REPAIR_PUBLISH_OK"
              exit 0
            fi
          done
          echo "::error::SELF_REPAIR_PUBLISH_FAILED: bounded retries exhausted."
          exit 1

      - name: Continue research after self-repair
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending="$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/research/autonomous-queue.json?ref=dev" | jq -r '.content' | tr -d '\\n' | base64 -d | jq '[.tasks[] | select(.status=="PENDING")] | length')"
          if [ "$pending" -gt 0 ]; then
            echo "SELF_REPAIR_HANDOFF: dispatching fresh research worker for $pending pending tasks."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/dispatches" -f ref=dev >/dev/null
          else
            echo "SELF_REPAIR_HANDOFF: research queue is empty."
          fi
