name: Autonomous research worker
# queue_policy: bounded-replan-with-entry-id-rotation
# selection_policy: one-pending-task-per-canonical-entry
# queue_integrity: unique-task-ids-and-no-duplicate-pending-entry
# verification_policy: require-Bukova-domain-and-practice-context
# worker_backend: multi-provider-1.1
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: autonomous-research-worker
  cancel-in-progress: false
# cadence_policy: every-5-minutes; queue repair + immediate implementation handoff
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Repair research queue
        shell: bash
        run: python3 scripts/repair_research_queue.py data/research/autonomous-queue.json
      - name: Select four research tasks
        shell: python
        run: |
          import json,pathlib
          from datetime import datetime,timezone
          q=json.load(open("data/research/autonomous-queue.json",encoding="utf-8"))
          out=pathlib.Path("data/research/worker-results"); out.mkdir(parents=True,exist_ok=True)
          tasks=[]
          seen=set()
          for t in q["tasks"]:
            if t.get("status")!="PENDING":
              continue
            key=t.get("canonical_entry_id") or t.get("bukova") or t.get("task_id")
            if key in seen:
              continue
            seen.add(key)
            tasks.append(t)
            if len(tasks)>=4:
              break
          now=datetime.now(timezone.utc)
          json.dump({"schema_version":"1.0","cycle_id":now.strftime("%Y%m%dT%H%M%SZ"),"created_at":now.isoformat(),"task_ids":[t["task_id"] for t in tasks]},open(out/"cycle-task-manifest.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
      - name: Publish live work plan
        shell: python
        run: |
          import json,pathlib
          from datetime import datetime,timezone
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          q=json.load(open("data/research/autonomous-queue.json",encoding="utf-8"))
          by_id={t["task_id"]:t for t in q["tasks"]}
          now=datetime.now(timezone.utc).isoformat()
          active=[]
          for tid in manifest["task_ids"]:
            t=by_id[tid]
            active.append({"task_id":tid,"bukova":t.get("bukova"),"canonical_entry_id":t.get("canonical_entry_id"),"status":"RUNNING","phase":"поиск источников","started_at":now,"finished_at":None,"expected":"Найти независимые свидетельства практического применения этой Буковы, зафиксировать источник, действие практика и наблюдаемый результат.","queries":t.get("queries",[])})
          json.dump({"schema_version":"1.1","cycle_id":manifest["cycle_id"],"updated_at":now,"active_tasks":active},open(out/"active-tasks.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          json.dump({"schema_version":"1.1","updated_at":now,"cycle_id":manifest["cycle_id"],"worker":"github-public-web","worker_status":"RUNNING","phase":"SEARCH","selected_tasks":len(active),"active_tasks":active,"execution":"MEASURED"},open(out.parent/"worker-status.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
      - name: Publish live status to dev
        shell: bash
        run: |
          git config user.name "toolbox-research-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/worker-status.json data/research/worker-results/active-tasks.json
          git commit -m "research: publish live worker start status" || true
          git fetch origin dev
          git rebase --autostash origin/dev
          for attempt in 1 2 3; do
            if git push origin HEAD:dev; then exit 0; fi
            git fetch origin dev
            git rebase origin/dev
          done
          exit 1
      - name: Run four parallel discovery agents
      - name: Verify discovered sources
        shell: python
        run: |
          import pathlib,subprocess,json
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          for task_id in manifest["task_ids"]:
            tf=out/(task_id+".task.json"); rf=out/(task_id+".result.json"); vf=out/(task_id+".verified.json")
            if rf.exists(): subprocess.run(["python3","scripts/verify_research_sources.py",str(tf),str(rf),str(vf)],check=False)
      - name: Normalize practitioner evidence
        shell: python
        run: |
          import pathlib,subprocess,json
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          for task_id in manifest["task_ids"]:
            tf=out/(task_id+".task.json"); vf=out/(task_id+".verified.json"); rf=out/(task_id+".result.json"); nf=out/(task_id+".normalized.json")
            if vf.exists() and rf.exists(): subprocess.run(["python3","scripts/normalize_practitioner_evidence.py",str(tf),str(vf),str(nf)],check=False)
      - name: Apply practitioner evidence gate
        run: python3 scripts/practitioner_evidence_gate.py data/research/worker-results
      - name: Build human review queue
        run: python3 scripts/build_practitioner_review_queue.py data/research/worker-results
      - name: Replan unresolved research
        run: python3 scripts/replan_research_queue.py data/research/autonomous-queue.json data/research/worker-results data/research/worker-results/cycle-task-manifest.json
      - name: Write autonomous status
        shell: python
        run: |
          import json,pathlib
          from datetime import datetime,timezone
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          verified=sum(1 for x in manifest["task_ids"] if (out/(x+".verified.json")).exists())
          normalized=sum(1 for x in manifest["task_ids"] if (out/(x+".normalized.json")).exists())
          review=json.load(open("data/research/practitioner-review-queue.json",encoding="utf-8"))
          json.dump({"schema_version":"1.0","updated_at":datetime.now(timezone.utc).isoformat(),"cycle_id":manifest["cycle_id"],"worker":"github-public-web","phase":"DISCOVERY_VERIFY_NORMALIZE_GATE_REPLAN","execution":"MEASURED","selected_tasks":len(manifest["task_ids"]),"verified_tasks":verified,"normalized_tasks":normalized,"review_queue_count":review.get("queue_count",0),"evidence":"MEASURED","canonical_mutation":"DISABLED","next":"pending tasks continue next hourly cycle"},open("data/research/worker-status.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
      - name: Run implementation handoff
        run: |
          python3 scripts/autonomous_implementation_workers.py
          python3 scripts/validate-bukovy.py
          python3 - <<'PY'
          import pathlib, subprocess, sys
          root=pathlib.Path(".")
          forbidden=[]
          for p in subprocess.check_output(["git","diff","--name-only"],text=True).splitlines():
              if p and not (p.startswith("api/") or p.startswith("data/research/") or p=="research-status.html"):
                  forbidden.append(p)
          if forbidden:
              print("::error::Implementation handoff touched forbidden paths: "+", ".join(forbidden))
              sys.exit(1)
          print("PASS: implementation handoff write-zone invariant")
          PY

      - name: Commit evidence and queue to dev
        run: |
          git config user.name "toolbox-research-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api data/research
          git diff --cached --quiet || git commit -m "research: record autonomous evidence cycle"
          git fetch origin dev
          git rebase --autostash origin/dev
          for attempt in 1 2 3; do
            if git push origin HEAD:dev; then exit 0; fi
            git fetch origin dev
            git rebase origin/dev
          done
          echo "Autonomous research publish failed after 3 attempts."
          exit 1