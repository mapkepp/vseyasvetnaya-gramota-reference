name: Autonomous research worker
on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"
permissions:
  contents: write
concurrency:
  group: autonomous-research-worker
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Select six research tasks
        shell: python
        run: |
          import json,pathlib
          from datetime import datetime,timezone
          q=json.load(open("data/research/autonomous-queue.json",encoding="utf-8"))
          out=pathlib.Path("data/research/worker-results"); out.mkdir(parents=True,exist_ok=True)
          tasks=[t for t in q["tasks"] if t.get("status")=="PENDING"][:6]
          now=datetime.now(timezone.utc)
          json.dump({"schema_version":"1.0","cycle_id":now.strftime("%Y%m%dT%H%M%SZ"),"created_at":now.isoformat(),"task_ids":[t["task_id"] for t in tasks]},open(out/"cycle-task-manifest.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
      - name: Run six parallel discovery agents
        shell: python
        run: |
          import json,pathlib,subprocess,concurrent.futures
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          q=json.load(open("data/research/autonomous-queue.json",encoding="utf-8"))
          by_id={t["task_id"]:t for t in q["tasks"]}; tasks=[by_id[x] for x in manifest["task_ids"]]
          def run(t):
            tf=out/(t["task_id"]+".task.json"); rf=out/(t["task_id"]+".result.json")
            json.dump(t,open(tf,"w",encoding="utf-8"),ensure_ascii=False,indent=2)
            return subprocess.run(["python3","scripts/github_web_research_worker.py",str(tf),str(rf)],check=False).returncode
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex: results=list(zip(tasks,ex.map(run,tasks)))
          for t,rc in results: t["status"]="DONE" if rc==0 else "FAILED"
          json.dump(q,open("data/research/autonomous-queue.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
      - name: Build bounded specialist agent plan
        run: python3 scripts/agent_factory.py data/research/worker-results
      - name: Execute bounded specialist stages in parallel
        shell: python
        run: |
          import pathlib,subprocess,json,concurrent.futures
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          def specialist(task_id):
            tf=out/(task_id+".task.json"); rf=out/(task_id+".result.json")
            return subprocess.run(["python3","scripts/specialist_pipeline.py",str(tf),str(rf)],check=False).returncode if rf.exists() else 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex: list(ex.map(specialist,manifest["task_ids"]))
      - name: Measure and plan self-improvement
        run: python3 scripts/self_improvement_cycle.py
      - name: Apply safe self-improvement
        run: python3 scripts/self_improvement_apply.py
      - name: Verify discovered sources in parallel
        shell: python
        run: |
          import pathlib,subprocess,json,concurrent.futures
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          def verify(task_id):
            tf=out/(task_id+".task.json"); rf=out/(task_id+".result.json"); vf=out/(task_id+".verified.json")
            return subprocess.run(["python3","scripts/verify_research_sources.py",str(tf),str(rf),str(vf)],check=False).returncode if rf.exists() else 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex: list(ex.map(verify,manifest["task_ids"]))
      - name: Normalize practitioner evidence in parallel
        shell: python
        run: |
          import pathlib,subprocess,json,concurrent.futures
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          def normalize(task_id):
            tf=out/(task_id+".task.json"); vf=out/(task_id+".verified.json"); rf=out/(task_id+".result.json"); nf=out/(task_id+".normalized.json")
            return subprocess.run(["python3","scripts/normalize_practitioner_evidence.py",str(tf),str(vf),str(nf)],check=False).returncode if vf.exists() and rf.exists() else 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex: list(ex.map(normalize,manifest["task_ids"]))
      - name: Apply practitioner evidence gate
        run: python3 scripts/practitioner_evidence_gate.py data/research/worker-results
      - name: Build human review queue
        run: python3 scripts/build_practitioner_review_queue.py data/research/worker-results
      - name: Replan unresolved research
        run: python3 scripts/replan_research_queue.py data/research/autonomous-queue.json data/research/worker-results data/research/worker-results/cycle-task-manifest.json
      - name: Write autonomous status
        shell: python
        run: |
          import json,pathlib
          from datetime import datetime,timezone
          out=pathlib.Path("data/research/worker-results")
          manifest=json.load(open(out/"cycle-task-manifest.json",encoding="utf-8"))
          verified=sum(1 for x in manifest["task_ids"] if (out/(x+".verified.json")).exists())
          normalized=sum(1 for x in manifest["task_ids"] if (out/(x+".normalized.json")).exists())
          review=json.load(open("data/research/practitioner-review-queue.json",encoding="utf-8"))
          json.dump({"schema_version":"1.0","updated_at":datetime.now(timezone.utc).isoformat(),"cycle_id":manifest["cycle_id"],"worker":"github-public-web","phase":"DISCOVERY_VERIFY_NORMALIZE_GATE_REPLAN","execution":"MEASURED","selected_tasks":len(manifest["task_ids"]),"parallel_agents":6,"specialist_agent_roles":5,"pipeline":["DISCOVERY","SPECIALIZE","MEASURE","SELF_IMPROVE","VERIFY","NORMALIZE","GATE","REPLAN"],"verified_tasks":verified,"normalized_tasks":normalized,"review_queue_count":review.get("queue_count",0),"evidence":"MEASURED","canonical_mutation":"DISABLED","next":"pending tasks continue next scheduled cycle; watchdog may recover stalled runs"},open("data/research/worker-status.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
      - name: Commit evidence and queue to dev
        run: |
          git config user.name "toolbox-research-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/worker-results data/research/worker-status.json data/research/autonomous-queue.json data/research/practitioner-review-queue.json data/research/self-improvement.json data/research/agent-manifest.json data/research/self-improvement-application.json
          git diff --cached --quiet || git commit -m "research: record autonomous evidence cycle"
          git push origin HEAD:dev