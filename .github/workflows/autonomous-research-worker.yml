name: Autonomous research worker

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run queued research tasks
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib, datetime
          q=json.load(open("data/research/autonomous-queue.json",encoding="utf-8"))
          out=pathlib.Path("data/research/worker-results")
          out.mkdir(parents=True,exist_ok=True)
          tasks=[t for t in q["tasks"] if t.get("status")=="PENDING"][:4]
          for t in tasks:
              tf=out/(t["task_id"]+".task.json")
              rf=out/(t["task_id"]+".result.json")
              json.dump(t,open(tf,"w",encoding="utf-8"),ensure_ascii=False,indent=2)
              subprocess.run(["python3","scripts/research_worker.py",str(tf),str(rf)],check=False)
          status={
            "schema_version":"1.0",
            "updated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "worker":"tavily",
            "tasks_attempted":len(tasks),
            "execution":"MEASURED"
          }
          json.dump(status,open("data/research/worker-status.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY
      - name: Commit research evidence
        run: |
          git config user.name "toolbox-research-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/worker-results data/research/worker-status.json
          git diff --cached --quiet || git commit -m "research: record autonomous worker results"
          git push
