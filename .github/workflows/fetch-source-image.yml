name: Fetch source image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published source table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/source-sheets
          curl -L --fail --retry 3 --connect-timeout 20 -A "Mozilla/5.0"             "https://ic.pics.livejournal.com/art_afrodiziak/24988835/1980686/1980686_original.jpg"             -o images/source-sheets/livejournal-primary.jpg
          file images/source-sheets/livejournal-primary.jpg
      - name: Commit downloaded source image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/source-sheets
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add published source table image"
            git push
          fi
