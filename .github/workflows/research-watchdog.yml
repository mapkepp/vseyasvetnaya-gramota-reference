name: Autonomous research watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write
concurrency:
  group: dev-state-writers
  cancel-in-progress: false
  queue: max
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and repair worker installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin dev
          git worktree add /tmp/dev origin/dev
          repaired=0
          for f in scripts/repair_research_queue.py scripts/verify_research_sources.py scripts/replan_research_queue.py scripts/practitioner_evidence_gate.py scripts/build_practitioner_review_queue.py scripts/normalize_practitioner_evidence.py scripts/github_web_research_worker.py; do
            if ! test -f "/tmp/dev/$f"; then
              if git cat-file -e "origin/main:$f" 2>/dev/null; then
                mkdir -p "/tmp/dev/$(dirname "$f")"
                git show "origin/main:$f" > "/tmp/dev/$f"
                repaired=1
                echo "REPAIRED $f"
              else
                echo "::error::Missing worker component in dev and main: $f"
                exit 1
              fi
            fi
          done
          python3 -m py_compile /tmp/dev/scripts/*.py
          if [ "$repaired" = "1" ]; then
            cd /tmp/dev
            git config user.name "research-watchdog"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts
            git commit -m "fix(research): watchdog restore worker components"
            git push origin HEAD:dev
          fi
      - name: Check integrity and record system experience on dev
        run: |
          set -euo pipefail
          cd /tmp/dev
          python3 scripts/system_self_check.py
          python3 scripts/record_system_experience.py
          git config user.name "toolbox-self-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/system-health.json data/research/system-experience.json data/research/status-surface-registry.json
          git diff --cached --quiet || git commit -m "automation: record system health and experience"
          git fetch origin dev
          base_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/dev)"
          if ! git merge-base --is-ancestor "$base_sha" "$remote_sha"; then
            echo "::error::DEV_MOVED_DURING_WATCHDOG_HEALTH: refusing to overwrite newer dev."
            exit 78
          fi
          git push origin HEAD:dev

      - name: Check latest worker runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/runs?per_page=10")"
          latest="$(echo "$runs" | jq -r '.workflow_runs[0].id // empty')"
          status="$(echo "$runs" | jq -r '.workflow_runs[0].status // empty')"
          conclusion="$(echo "$runs" | jq -r '.workflow_runs[0].conclusion // empty')"
          echo "latest=$latest status=$status conclusion=$conclusion"
          queue="$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/research/autonomous-queue.json?ref=dev" | jq -r '.content' | tr -d '\n' | base64 -d)"
          pending="$(echo "$queue" | jq '[.tasks[] | select(.status=="PENDING")] | length')"
          worker="$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/research/worker-status.json?ref=dev" | jq -r '.content' | tr -d '\n' | base64 -d)"
          heartbeat="$(echo "$worker" | jq -r '.updated_at // empty')"
          age=999999
          if [ -n "$heartbeat" ]; then
            hb_epoch="$(date -d "$heartbeat" +%s 2>/dev/null || echo 0)"
            now_epoch="$(date +%s)"
            [ "$hb_epoch" -gt 0 ] && age=$((now_epoch-hb_epoch))
          fi
          echo "pending=$pending heartbeat_age_sec=$age latest=$latest status=$status conclusion=$conclusion"
          if [ -n "$latest" ] && [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
            echo "Последний worker завершился с ошибкой — запускаем повтор."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${latest}/rerun" >/dev/null
            exit 0
          fi
          if [ "$pending" -gt 0 ] && [ "$age" -gt 2100 ] && [ "$status" != "in_progress" ] && [ "$status" != "queued" ]; then
            echo "Очередь не пуста и heartbeat устарел — принудительно запускаем worker на dev."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/dispatches" -f ref=dev >/dev/null
            exit 0
          fi
          if [ "$status" != "in_progress" ] && [ "$status" != "queued" ]; then
            echo "Нет выполняющегося worker — запускаем новый цикл."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/dispatches" -f ref=dev >/dev/null
          fi
