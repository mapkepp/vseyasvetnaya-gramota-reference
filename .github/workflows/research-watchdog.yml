name: Research watchdog
# runtime-validation-trigger: verify self-repair handoff
on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_run:
    workflows: ["Autonomous research worker", "System integrity and self-repair"]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: research-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - name: Detect state and recover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin dev --prune
          queue="$(git show origin/dev:data/research/autonomous-queue.json)"
          pending="$(echo "$queue" | jq '[.tasks[] | select(.status=="PENDING")] | length')"
          worker_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/runs?branch=dev&per_page=10")"
          repair_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/system-self-repair.yml/runs?branch=dev&per_page=10")"
          worker_active="$(echo "$worker_runs" | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')"
          repair_active="$(echo "$repair_runs" | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')"
          latest="$(echo "$worker_runs" | jq -r '.workflow_runs[0] // {}')"
          status="$(echo "$latest" | jq -r '.status // empty')"
          conclusion="$(echo "$latest" | jq -r '.conclusion // empty')"
          latest_id="$(echo "$latest" | jq -r '.id // empty')"
          worker="{}"
          if worker_text="$(git show origin/dev:data/research/worker-status.json 2>/dev/null)"; then
            worker="$worker_text"
          fi
          heartbeat="$(echo "$worker" | jq -r '.updated_at // empty')"
          age=999999
          if [ -n "$heartbeat" ]; then
            hb_epoch="$(date -d "$heartbeat" +%s 2>/dev/null || echo 0)"
            now_epoch="$(date +%s)"
            [ "$hb_epoch" -gt 0 ] && age=$((now_epoch-hb_epoch))
          fi
          echo "pending=$pending worker_active=$worker_active repair_active=$repair_active heartbeat_age=$age latest_status=$status latest_conclusion=$conclusion"
          if [ "$pending" -eq 0 ]; then
            echo "WATCHDOG_OK: queue empty."
            exit 0
          fi
          if [ "$repair_active" -gt 0 ]; then
            echo "WATCHDOG_WAIT: self-repair already active; never dispatch worker concurrently."
            exit 0
          fi
          if [ "$worker_active" -gt 0 ] && [ "$age" -gt 900 ]; then
            echo "STALE_ACTIVE_WORKER: cancel stale worker and start exactly one self-repair."
            [ -n "$latest_id" ] && gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$latest_id/cancel" >/dev/null || true
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/system-self-repair.yml/dispatches" -f ref=dev >/dev/null
            exit 0
          fi
          if [ "$worker_active" -gt 0 ]; then
            echo "WATCHDOG_OK: worker active with fresh heartbeat."
            exit 0
          fi
          if [ "$age" -gt 900 ] || [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "timed_out" ]; then
            echo "RECOVERY_NEEDED: no active worker and unhealthy last state; self-repair first."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/system-self-repair.yml/dispatches" -f ref=dev >/dev/null
            exit 0
          fi
          echo "NO_ACTIVE_WORKER: dispatch exactly one worker."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/dispatches" -f ref=dev >/dev/null
