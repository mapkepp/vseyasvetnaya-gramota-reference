name: Autonomous research watchdog
# recovery-loop: stale-check -> self-repair -> worker-handoff
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-watchdog.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Autonomous research worker", "System integrity and self-repair"]
    types: [completed]

permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: dev-state-writers
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and repair worker installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin dev
          git worktree add /tmp/dev origin/dev
          repaired=0
          for f in scripts/repair_research_queue.py scripts/verify_research_sources.py scripts/replan_research_queue.py scripts/practitioner_evidence_gate.py scripts/build_practitioner_review_queue.py scripts/normalize_practitioner_evidence.py scripts/github_web_research_worker.py; do
            if ! test -f "/tmp/dev/$f"; then
              if git cat-file -e "origin/main:$f" 2>/dev/null; then
                mkdir -p "/tmp/dev/$(dirname "$f")"
                git show "origin/main:$f" > "/tmp/dev/$f"
                repaired=1
                echo "REPAIRED $f"
              else
                echo "::error::Missing worker component in dev and main: $f"
                exit 1
              fi
            fi
          done
          python3 -m py_compile /tmp/dev/scripts/*.py
          if [ "$repaired" = "1" ]; then
            cd /tmp/dev
            git config user.name "research-watchdog"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts
            git commit -m "fix(research): watchdog restore worker components"
            git push origin HEAD:dev
          fi
      - name: Check worker, record result and recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/research
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/runs?per_page=10")"
          latest="$(echo "$runs" | jq -r '.workflow_runs[0].id // empty')"
          status="$(echo "$runs" | jq -r '.workflow_runs[0].status // empty')"
          conclusion="$(echo "$runs" | jq -r '.workflow_runs[0].conclusion // empty')"
          queue="$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/research/autonomous-queue.json?ref=dev" | jq -r '.content' | tr -d '\n' | base64 -d)"
          pending="$(echo "$queue" | jq '[.tasks[] | select(.status=="PENDING")] | length')"
          worker="{}"
          if worker_payload="$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/research/worker-status.json?ref=dev" 2>/dev/null)"; then
            worker="$(echo "$worker_payload" | jq -r '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || echo "{}")"
          fi
          heartbeat="$(echo "$worker" | jq -r '.updated_at // empty')"
          age=999999
          if [ -n "$heartbeat" ]; then
            hb_epoch="$(date -d "$heartbeat" +%s 2>/dev/null || echo 0)"
            now_epoch="$(date +%s)"
            [ "$hb_epoch" -gt 0 ] && age=$((now_epoch-hb_epoch))
          fi
          python3 - <<PY
          import json, pathlib
          from datetime import datetime, timezone
          p=pathlib.Path("data/research/watchdog-history.json")
          try:d=json.loads(p.read_text())
          except Exception:d={"schema_version":"1.0","checks":[]}
          check={"checked_at":datetime.now(timezone.utc).isoformat(),"latest_run_id":"$latest","worker_status":"$status","conclusion":"$conclusion","pending":int("$pending"),"heartbeat_age_seconds":int("$age")}
          d["checks"]=[check]+d.get("checks",[])[:99]
          failures=0
          for x in d["checks"]:
            if x.get("pending",0)>0 and (x.get("worker_status") not in ("in_progress","queued") or x.get("heartbeat_age_seconds",999999)>900):
              failures+=1
            else: break
          d["consecutive_recovery_failures"]=failures
          d["state"]="RECOVERY_REQUIRED" if failures>=3 else ("RECOVERY_PENDING" if failures else "HEALTHY")
          d["updated_at"]=check["checked_at"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "research-watchdog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/watchdog-history.json
          git diff --cached --quiet || git commit -m "automation: record watchdog check"
          git push origin HEAD:main || true

          if [ "$pending" -gt 0 ] && [ "$age" -gt 900 ]; then
            if [ "$status" = "in_progress" ] || [ "$status" = "queued" ]; then
              echo "STALE_ACTIVE_WORKER: heartbeat устарел у активного worker — отменяем зависший run и запускаем self-repair."
              if [ -n "$latest" ]; then
                gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$latest/cancel" >/dev/null || true
              fi
            else
              echo "STALE_FINISHED_WORKER: очередь не обработана и heartbeat устарел — запускаем self-repair перед новым worker."
            fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/system-self-repair.yml/dispatches" -f ref=dev >/dev/null
          elif [ "$status" != "in_progress" ] && [ "$status" != "queued" ] && [ "$pending" -gt 0 ]; then
            echo "Нет активного worker — запускаем новый worker от текущего dev."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-worker.yml/dispatches" -f ref=dev >/dev/null
          fi
          failures="$(jq -r '.consecutive_recovery_failures // 0' data/research/watchdog-history.json)"
          if [ "$pending" -gt 0 ] && [ "$failures" -ge 3 ]; then
            echo "::error::ASSISTANT_REQUIRED: worker не восстановился после нескольких проверок."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/toolbox-evolution.yml/dispatches" -f ref=dev >/dev/null || true
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" -f title="[ASSISTANT-REQUIRED] Автовосстановление worker не сработало" -f body="Watchdog зафиксировал $failures последовательных проблемных проверок при наличии ожидающих задач. Запущены свежий worker, self-repair и toolbox evolution. Нужен разбор ассистентом." >/dev/null || true
          fi
