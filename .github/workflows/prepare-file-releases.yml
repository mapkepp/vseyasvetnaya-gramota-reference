name: Prepare private file storage releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-storage-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure MY-FILES release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view MY-FILES --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create MY-FILES --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "MY-FILES storage" --notes "Private binary storage for F My Files" --prerelease

      - name: Ensure MY-FILES-FAST release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view MY-FILES-FAST --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create MY-FILES-FAST --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "MY-FILES-FAST storage" --notes "Private binary storage for F My Files FAST" --prerelease
