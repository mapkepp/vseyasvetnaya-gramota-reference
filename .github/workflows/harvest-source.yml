name: Harvest published source page

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch source page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/source-harvest images/source-sheets/dm80
          curl -L --fail --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "https://gramota.dm80.ru/prayazik/" -o data/source-harvest/prayazik.html
          wc -c data/source-harvest/prayazik.html

      - name: Extract source structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import json, pathlib, re

          raw = pathlib.Path("data/source-harvest/prayazik.html").read_bytes()
          m = re.search(br'charset[[:space:]]*=[[:space:]]*["'\''']?([A-Za-z0-9_-]+)', raw[:10000], re.I)
          enc = m.group(1).decode("ascii", "ignore") if m else "cp1251"
          try:
              html = raw.decode(enc, errors="replace")
          except LookupError:
              html = raw.decode("cp1251", errors="replace")

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.blocks = []
                  self.cur = []
                  self.skip = 0
              def flush(self):
                  s = " ".join(" ".join(self.cur).split())
                  if s:
                      self.blocks.append({"type":"text","text":s})
                  self.cur = []
              def handle_starttag(self, tag, attrs):
                  t = tag.lower()
                  a = dict(attrs)
                  if t == "img":
                      self.flush()
                      src = a.get("src")
                      if src:
                          self.blocks.append({"type":"image","src":urljoin("https://gramota.dm80.ru/prayazik/",src)})
                  elif t in ("script","style"):
                      self.skip += 1
                  elif t in ("p","div","br","h1","h2","h3","h4","li","tr","td"):
                      self.flush()
              def handle_endtag(self, tag):
                  t = tag.lower()
                  if t in ("p","div","br","h1","h2","h3","h4","li","tr","td"):
                      self.flush()
                  elif t in ("script","style") and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      s = " ".join(data.split())
                      if s:
                          self.cur.append(s)

          p=P(); p.feed(html); p.flush()
          records=[]
          current=None
          for b in p.blocks:
              if b["type"] == "image":
                  if current:
                      records.append(current)
                  current={"image_url":b["src"],"text":[]}
              elif current:
                  current["text"].append(b["text"])
          if current:
              records.append(current)

          out={
              "source_url":"https://gramota.dm80.ru/prayazik/",
              "encoding_detected":enc,
              "image_count":len([b for b in p.blocks if b["type"]=="image"]),
              "image_urls":[b["src"] for b in p.blocks if b["type"]=="image"],
              "image_records":records
          }
          pathlib.Path("data/source-harvest/source-structure.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),"utf-8")
          print("encoding:",enc,"records:",len(records))
          PY

      - name: Download published source images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request, re
          src=json.loads(pathlib.Path("data/source-harvest/source-structure.json").read_text("utf-8"))
          out=pathlib.Path("images/source-sheets/dm80")
          out.mkdir(parents=True,exist_ok=True)
          for u in src["image_urls"]:
              if not u.startswith("https://gramota.dm80.ru/prayazik/"):
                  continue
              name=pathlib.PurePosixPath(u.split("?",1)[0]).name
              if not re.match(r"^Image[0-9]+[.](gif|jpg|jpeg|png)$",name,re.I):
                  continue
              dst=out/name
              if dst.exists():
                  continue
              print("Downloading",name)
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      dst.write_bytes(r.read())
              except Exception as e:
                  print("FAILED",name,repr(e))
          print("downloaded:",len(list(out.iterdir())))
          PY

      - name: Build catalog from published descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          src=json.loads(pathlib.Path("data/source-harvest/source-structure.json").read_text("utf-8"))
          entries=[]
          for rec in src["image_records"]:
              texts=rec.get("text",[])
              if not texts:
                  continue
              first=texts[0].strip()
              if " - " not in first:
                  continue
              left, right = first.split(" - ", 1)
              name=left.strip(' "«»')
              if not name or len(name)>100:
                  continue
              desc=" ".join(texts).strip()
              url=rec["image_url"]
              filename=pathlib.PurePosixPath(url.split("?",1)[0]).name
              local=None
              if url.startswith("https://gramota.dm80.ru/prayazik/"):
                  p=pathlib.Path("images/source-sheets/dm80")/filename
                  if p.exists():
                      local=str(p).replace("\\","/")
              entry={
                  "source_id":len(entries)+1,
                  "name":name,
                  "status":"source-described",
                  "description_claim":desc,
                  "source_url":src["source_url"],
                  "source_image_url":url
              }
              if local:
                  entry["image"]=local
              entries.append(entry)

          out={
              "title":"ВсеЯСветная Грамота — Буковник",
              "claimed_count":147,
              "catalog_status":"partial-primary-web-source",
              "note":"Published source page currently yields the image-linked descriptions available here. Remaining claimed entries are not invented.",
              "entries":entries
          }
          pathlib.Path("data/bukovy.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),"utf-8")
          print("catalog entries:",len(entries))
          PY

      - name: Commit harvest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-harvest data/bukovy.json images/source-sheets/dm80
          if git diff --cached --quiet; then
            echo "No harvest changes"
          else
            git commit -m "Harvest source glyphs and build catalog"
            git push
          fi
