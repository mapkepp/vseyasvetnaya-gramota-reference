name: Validate Bukovy data

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild generated API
        run: python3 scripts/build-api.py

      - name: Reject stale generated API
        run: |
          git diff --exit-code -- api/v1
          test -z "$(git ls-files --others --exclude-standard -- api/v1)"

      - name: Validate canonical catalog and API
        run: python3 scripts/validate-bukovy.py
