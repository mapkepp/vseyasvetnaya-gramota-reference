name: Autonomous implementation workers
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "47 * * * *"
permissions:
  contents: write
concurrency:
  group: dev-state-writers
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'dev' }}
      - name: Run implementation workers
        run: python3 scripts/autonomous_implementation_workers.py
      - name: Validate canonical invariants
        run: |
          python3 scripts/validate-bukovy.py
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          root=pathlib.Path(".")
          forbidden=[]
          for p in subprocess.check_output(["git","diff","--name-only"],text=True).splitlines():
              if p and not (p.startswith("api/") or p.startswith("data/research/") or p=="research-status.html"):
                  forbidden.append(p)
          if forbidden:
              print("::error::Implementation worker touched forbidden paths: "+", ".join(forbidden))
              sys.exit(1)
          print("PASS: implementation write-zone invariant")
          PY
      - name: Publish implementation state to dev
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "toolbox-implementation-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api data/research
          git diff --cached --quiet || git commit -m "automation: record implementation worker cycle"
          git fetch origin dev
          git rebase origin/dev
          for attempt in 1 2 3; do
            if git push origin HEAD:dev; then exit 0; fi
            git fetch origin dev
            git rebase origin/dev
          done
          echo "Implementation worker publish failed after 3 attempts."
          exit 1
